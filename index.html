/* ============================================================
   引擎
   ============================================================ */
const stageEl = document.getElementById("stage");
const bgEl = document.getElementById("bg");
const coverEl = document.getElementById("cover");
const prologueEl = document.getElementById("prologue");
const teacherEl = document.getElementById("teacher");
const epilogueEl = document.getElementById("epilogue");
const silBox = document.getElementById("silBox");
const quoteText = document.getElementById("quoteText");
const narText = document.getElementById("narText");
const relicTag = document.getElementById("relicTag");
const powerTag = document.getElementById("powerTag");
const sourceTag = document.getElementById("sourceTag");
const barEl = document.getElementById("bar");
const muteBtn = document.getElementById("mute-btn");
const rollList = document.getElementById("rollList");

let current = -1;
let playing = false;
let timer = null;
let muted = false;

function showScene(i){
  current = i;
  const s = SCENES[i];
  [prologueEl, teacherEl, epilogueEl].forEach(e => e.classList.remove("active"));

  if(s.type === "prologue"){
    prologueEl.classList.add("active");
    bgEl.style.background = "linear-gradient(180deg,#fbf7ee 0%,#f3ead7 100%)";
  } else if(s.type === "teacher"){
    silBox.innerHTML = SIL[s.id];
    powerTag.textContent = "「" + s.power + "」";
    sourceTag.textContent = s.name + " · " + s.source;
    quoteText.textContent = s.quote;
    narText.textContent = s.nar;
    relicTag.textContent = s.relic ? "\u25c8 " + s.relic + " \u25c8" : "";
    teacherEl.classList.add("active");
    bgEl.style.background = "linear-gradient(180deg,#faf5ea 0%,#efe4cd 100%)";
  } else if(s.type === "epilogue"){
    rollList.innerHTML = SCENES.filter(x => x.type === "teacher").map(x =>
      `<span><b>${x.power}</b> · ${x.name}</span>`).join("");
    epilogueEl.classList.add("active");
    bgEl.style.background = "linear-gradient(180deg,#f7ecd3 0%,#e9c98f 55%,#d9a95e 100%)";
  }
  barEl.style.width = ((i+1) / SCENES.length * 100) + "%";
  playCue(s);
}

function schedule(){
  clearTimeout(timer);
  if(!playing) return;
  const s = SCENES[current];
  timer = setTimeout(() => {
    if(current >= SCENES.length - 1){ playing = false; }
    else { showScene(current + 1); schedule(); }
  }, s.dur);
}

function start(){
  coverEl.classList.add("hide");
  initAudio();
  playing = true;
  showScene(0);
  schedule();
}

function togglePlay(){
  if(current < 0) return;
  playing = !playing;
  if(playing) schedule();
}

function go(i){
  if(i < 0 || i >= SCENES.length) return;
  playing = false;
  clearTimeout(timer);
  showScene(i);
}

window.addEventListener("keydown", (e) => {
  if(current < 0){ if(e.code === "Space" || e.code === "Enter"){ e.preventDefault(); start(); } return; }
  if(e.code === "Space"){ e.preventDefault(); togglePlay(); }
  else if(e.code === "ArrowRight"){ go(current + 1); }
  else if(e.code === "ArrowLeft"){ go(current - 1); }
});

/* 触摸翻页（移动端） */
document.getElementById("navPrev").addEventListener("click", (e) => { e.stopPropagation(); go(current - 1); });
document.getElementById("navNext").addEventListener("click", (e) => { e.stopPropagation(); go(current + 1); });

/* 触摸滑动翻页（左右滑切换） */
let touchX = null;
document.getElementById("stage").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, {passive:true});
document.getElementById("stage").addEventListener("touchend", (e) => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 50){ if(dx < 0) go(current + 1); else go(current - 1); }
  touchX = null;
}, {passive:true});

coverEl.addEventListener("click", start);

muteBtn.addEventListener("click", () => {
  muted = !muted;
  muteBtn.textContent = muted ? "🔇 静" : "🔊 音";
  if(masterGain) masterGain.gain.value = muted ? 0 : 0.16;
});

/* ============================================================
   配乐 —— 五声音阶柔和拨弦（古筝/风铃感），低音量
   ============================================================ */
let audioCtx = null, masterGain = null;

function initAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = muted ? 0 : 0.16;
  masterGain.connect(audioCtx.destination);
}

/* 中国五声音阶（宫商角徵羽） */
const PENTA = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

function pluck(freq, when, vol){
  if(!audioCtx) return;
  /* 基音 */
  const o = audioCtx.createOscillator();
  o.type = "sine"; o.frequency.value = freq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 1.9);
  o.connect(g); g.connect(masterGain);
  o.start(when); o.stop(when + 2.1);
  /* 泛音，让音色更暖 */
  const o2 = audioCtx.createOscillator();
  o2.type = "sine"; o2.frequency.value = freq * 2;
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.0001, when);
  g2.gain.exponentialRampToValueAtTime(vol * 0.25, when + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001, when + 1.1);
  o2.connect(g2); g2.connect(masterGain);
  o2.start(when); o2.stop(when + 1.3);
}

function playCue(s){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;
  if(s.type === "prologue"){
    /* 极轻的沙沙声 */
    playNoise(6.2, 0.03);
  } else if(s.type === "teacher"){
    /* 每幕一段五声音阶小琶音，柔和 */
    const idx = SCENES.indexOf(s) % 4;
    const motif = [
      [0, 2, 4, 5],   /* C E G A */
      [1, 3, 5, 6],   /* D F#? -> 用 D E G A 简化为 [1,2,4,5] */
      [2, 4, 5, 7],
      [3, 5, 6, 8]
    ][idx];
    motif.forEach((p, k) => pluck(PENTA[p], t0 + k * 0.42, 0.13));
  } else if(s.type === "epilogue"){
    /* 尾声温暖上行琶音 */
    [0,2,4,5,7,9].forEach((p,k) => pluck(PENTA[p], t0 + k * 0.5, 0.15));
    [0,2,4,5].forEach((p,k) => pluck(PENTA[p], t0 + 4.2 + k * 0.5, 0.12));
  }
}

function playNoise(dur, vol){
  if(!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * dur;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * vol; }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  src.connect(g); g.connect(masterGain);
  src.start();
}
